    <!-- Тема применяется до загрузки CSS/React, чтобы не было вспышки белого.
         Должно совпадать с frontend/src/theme.ts. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('sk_theme');
          var dark = saved === 'dark' || (saved !== 'light' &&
            window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var resolved = dark ? 'dark' : 'light';
          document.documentElement.dataset.theme = resolved;
          document.documentElement.dataset.bsTheme = resolved;
          document.documentElement.style.colorScheme = resolved;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', dark ? '#09090b' : '#f1f2f7');
        } catch (e) { /* приватный режим и т.п. */ }
      })();
    </script>
