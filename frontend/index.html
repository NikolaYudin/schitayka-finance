<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1a365d" />
    <title>СчитайКа — учёт финансов и целей</title>
    <!-- Тема применяется до загрузки CSS/React, чтобы не было вспышки белого.
         Должно совпадать с frontend/src/theme.ts. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('sk_theme');
          var dark = saved === 'dark' || (saved !== 'light' &&
            window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', dark ? '#0f172a' : '#1a365d');
        } catch (e) { /* приватный режим и т.п. */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
